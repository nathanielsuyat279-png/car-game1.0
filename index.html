<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Game</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
  }

  #gameArea {
    width: 400px;
    height: 600px;
    background: #444;
    margin: 20px auto;
    position: relative;
    border: 3px solid #000;
    border-radius: 10px;
    overflow: hidden;
  }

  #car {
    width: 40px;
    height: 80px;
    background: red;
    position: absolute;
    bottom: 20px;
    left: 180px;
    border-radius: 4px;
  }

  .obstacle {
    width: 40px;
    height: 80px;
    background: yellow;
    position: absolute;
    top: -100px;
  }

  #controls {
    margin-top: 15px;
  }

  button {
    background: #333;
    color: white;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    margin: 5px;
    border-radius: 8px;
    cursor: pointer;
  }

  button:active {
    background: #777;
  }

  #scoreBoard {
    font-size: 18px;
    margin-top: 10px;
  }

  #crashVideo {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 9999;
  }
</style>
</head>
<body>

<h2>Car Game</h2>
<div id="scoreBoard">
  Score: <span id="score">0</span> |
  High Score: <span id="highScore">0</span> |
  Speed Mode: <span id="speedMode">1x</span>
</div>

<div id="gameArea">
  <div id="car"></div>
</div>

<div id="controls">
  <button id="leftBtn">Left</button>
  <button id="rightBtn">Right</button>
  <button id="startBtn">Start / Restart</button>
</div>

<!-- MP4 video overlay -->
<video id="crashVideo" src="what if bumalik.mp4"></video>

<script>
  const car = document.getElementById("car");
  const gameArea = document.getElementById("gameArea");
  const scoreDisplay = document.getElementById("score");
  const highScoreDisplay = document.getElementById("highScore");
  const speedModeDisplay = document.getElementById("speedMode");
  const leftBtn = document.getElementById("leftBtn");
  const rightBtn = document.getElementById("rightBtn");
  const startBtn = document.getElementById("startBtn");
  const crashVideo = document.getElementById("crashVideo");

  let carLeft = 180;
  let score = 0;
  let highScore = 0;
  let gameOver = true;
  let obstacleSpeed = 5;
  let obstacleTimer;

  leftBtn.onclick = () => moveCar("left");
  rightBtn.onclick = () => moveCar("right");
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") moveCar("left");
    if (e.key === "ArrowRight") moveCar("right");
  });
  startBtn.onclick = startGame;

  function moveCar(direction) {
    if (gameOver) return;
    if (direction === "left" && carLeft > 0) carLeft -= 20;
    if (direction === "right" && carLeft < 360) carLeft += 20;
    car.style.left = carLeft + "px";
  }

  function startGame() {
    const obstacles = document.querySelectorAll(".obstacle");
    obstacles.forEach(o => o.remove());
    score = 0;
    obstacleSpeed = 5;
    scoreDisplay.textContent = score;
    speedModeDisplay.textContent = "1x";
    gameOver = false;
    carLeft = 180;
    car.style.left = carLeft + "px";

    if (obstacleTimer) clearInterval(obstacleTimer);
    obstacleTimer = setInterval(createObstacle, 1200);
  }

  function createObstacle() {
    if (gameOver) return;
    const obstacle = document.createElement("div");
    obstacle.classList.add("obstacle");
    obstacle.style.left = Math.floor(Math.random() * 360) + "px";
    gameArea.appendChild(obstacle);
    moveObstacle(obstacle);
  }

  function moveObstacle(obstacle) {
    let obstacleTop = -100;
    const move = setInterval(() => {
      if (gameOver) {
        clearInterval(move);
        return;
      }

      obstacleTop += obstacleSpeed;
      obstacle.style.top = obstacleTop + "px";

      if (obstacleTop > 600) {
        clearInterval(move);
        obstacle.remove();
        score++;
        scoreDisplay.textContent = score;

        if (score % 5 === 0) {
          obstacleSpeed += 1;
          speedModeDisplay.textContent = (obstacleSpeed / 5).toFixed(1) + "x";
        }

        if (score > highScore) {
          highScore = score;
          highScoreDisplay.textContent = highScore;
        }
      }

      const carRect = car.getBoundingClientRect();
      const obsRect = obstacle.getBoundingClientRect();

      if (
        obsRect.bottom > carRect.top &&
        obsRect.top < carRect.bottom &&
        obsRect.left < carRect.right &&
        obsRect.right > carRect.left
      ) {
        gameOver = true;
        clearInterval(move);
        clearInterval(obstacleTimer);
        playCrashVideo();
      }
    }, 30);
  }

  function playCrashVideo() {
    crashVideo.style.display = "block";
    crashVideo.play();
    crashVideo.onended = () => {
      crashVideo.style.display = "none";
      alert("Game Over! Final Score: " + score);
    };
  }
</script>
</body>
</html>
